name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 4-core runner with 16 GB of RAM; the Android plugin does not need more.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true

jobs:
  test:
    # Every push to main: the same local gate, no release assets.
    if: github.ref_type == 'branch' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - run: ./tools/verify

  apk:
    # Tags publish a GitHub release; a manual dispatch builds the same APK without publishing.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - name: Tag must match versionName
        if: github.ref_type == 'tag'
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$name" || { echo "::error::cannot read versionName"; exit 1; }
          test "v$name" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match versionName $name"; exit 1; }
      - name: Restore the release signing key
        # The dedicated key replaced the old public debug identity; installs from before the
        # rotation need one reinstall before they can update in place again.
        env:
          KEYSTORE_B64: ${{ secrets.DRIZZIQ_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DRIZZIQ_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DRIZZIQ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD; do
            [ -n "${!secret}" ] || { echo "::error::missing signing secret $secret"; exit 1; }
          done
          keystore="$RUNNER_TEMP/drizziq-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          {
            printf 'DRIZZIQ_STORE_FILE=%s\n' "$keystore"
            printf 'DRIZZIQ_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'DRIZZIQ_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build, test and lint
        run: ./tools/verify
      - name: Assert the APK keeps the release signature
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1 || true)
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::$apk missing"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: 59d3288d932edeca6601f2c117d54ec5c4a362a70a3a6c71655a636d0fbc3152" \
            "$RUNNER_TEMP/certs.txt" ||
            { echo "::error::APK is not signed with the drizziq release key"; exit 1; }
      - name: Assert the APK reports the repository version
        run: |
          set -euo pipefail
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1 || true)
          test -n "$aapt2" || { echo "::error::aapt2 not found"; exit 1; }
          "$aapt2" dump badging app/build/outputs/apk/release/app-release.apk |
            grep -q "versionName='$name' " ||
            { echo "::error::APK does not report versionName $name"; exit 1; }
      - name: Package release asset
        run: |
          set -euo pipefail
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/drizziq-$name.apk"
          cd dist
          sha256sum "drizziq-$name.apk" >"drizziq-$name.apk.sha256"
          cat "drizziq-$name.apk.sha256"
      - name: Upload preview artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: drizziq-preview-apk
          path: dist/*
          retention-days: 14
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
